name: Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tools
        run: python -m pip install 'maturin>=1.15,<2' build pytest ruff
      - name: Check Python
        run: |
          ruff check python tests scripts _build_backend.py
          ruff format --check python tests scripts _build_backend.py
          cargo fmt --manifest-path rust/Cargo.toml --check
      # `build` creates an sdist, extracts it, then builds the wheel from that
      # archive. This catches missing submodule sources and Cargo configuration.
      - name: Build source archive and wheel
        run: python -m build
      - name: Test installed wheel
        run: |
          python -m pip install dist/*.whl
          python -m pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*
