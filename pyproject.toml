[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "layerfs"
dynamic = ["version"]
description = "Python distribution of the LayerFS Rust daemon"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "upstream/layerfs/LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: System :: Filesystems",
]

[project.urls]
Upstream = "https://github.com/Ephemeral-AI-Lab/layerfs"
Documentation = "https://layerfs.ai/docs/"

[tool.maturin]
bindings = "bin"
manifest-path = "rust/Cargo.toml"
module-name = "layerfs"
python-source = "python"
strip = true
locked = true
include = [
    { path = ".cargo/config.toml", format = "sdist" },
    # Maturin does not collect this target-specific Cargo patch on macOS.
    { path = "upstream/layerfs/core/vendor/fuser-0.18.0/**/*", format = "sdist" },
    { path = "upstream/layerfs/LICENSE", format = "sdist" },
    { path = "tests/**/*.py", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
