[build-system]
requires = ["maturin>=1.15,<2.0", "wheel>=0.45,<1"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "layerfs"
dynamic = ["version"]
description = "In-process Python bindings and daemon for LayerFS"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "upstream/layerfs/LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: System :: Filesystems",
]

[project.urls]
Upstream = "https://github.com/Ephemeral-AI-Lab/layerfs"
Documentation = "https://github.com/soasme/layerfs-python/tree/main/docs"
Source = "https://github.com/soasme/layerfs-python"

[tool.maturin]
bindings = "pyo3"
manifest-path = "rust/Cargo.toml"
module-name = "layerfs._native"
targets = [
    { name = "_native", kind = "cdylib" },
]
python-source = "python"
strip = true
locked = true
include = [
    { path = "_build_backend.py", format = "sdist" },
    { path = ".cargo/config.toml", format = "sdist" },
    # Maturin does not collect this target-specific Cargo patch on macOS.
    { path = "upstream/layerfs/core/vendor/fuser-0.18.0/**/*", format = "sdist" },
    { path = "upstream/layerfs/LICENSE", format = "sdist" },
    { path = "tests/**/*.py", format = "sdist" },
    { path = "docs/**/*.md", format = "sdist" },
    { path = "scripts/**/*.py", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
]

[tool.cibuildwheel]
build = ["cp39-manylinux_*", "cp39-macosx_*"]
test-requires = ["pytest"]
test-command = "python -m pytest {project}/tests -q --basetemp={project}/.pytest-store"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.92.0"
environment = { CARGO_HOME = "/tmp/cargo", RUSTUP_HOME = "/tmp/rustup", PATH = "/tmp/cargo/bin:$PATH" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
extend-exclude = ["upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "_build_backend.py" },
    { file = "rust/Cargo.toml" },
    { file = "rust/Cargo.lock" },
    { file = "rust/src/**/*.rs" },
    { file = ".cargo/config.toml" },
    { git = { commit = true } },
]
