# Cargo discovers configuration from the build's working directory, not from
# --manifest-path. Mirror upstream/layerfs/.cargo/config.toml here so Maturin
# preserves the required ARM crypto and SQLite build settings.
[target.'cfg(target_arch = "aarch64")']
rustflags = [
    "--cfg", "aes_armv8",
    "--cfg", "polyval_armv8",
    "--cfg", "chacha20_force_neon",
    "-C", "target-feature=+aes,+sha2",
]

[env]
LIBSQLITE3_FLAGS = "-USQLITE_ENABLE_MEMORY_MANAGEMENT"
